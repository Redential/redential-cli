name: Release

# Publishes to npm. Triggers ONLY on a pushed tag matching v* — never on
# pull_request, never on a branch push. This is deliberate: pull_request
# workflows can run against a fork's untrusted code, and this is the one
# workflow in this repo with publish rights — see docs/releasing.md.
#
# Publishing auth is OIDC "trusted publishing": npmjs.com is configured
# to trust THIS repo + THIS workflow file directly (npm package settings
# -> Trusted Publisher), so there is no NPM_TOKEN secret anywhere —
# nothing to expire, nothing to steal. The id-token permission below
# powers both that trust exchange and the --provenance attestation.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # id-token: write is what lets `npm publish --provenance` mint a
  # Sigstore-signed attestation tying this tarball to this exact commit,
  # workflow run, and trigger — see docs/releasing.md's "Verifying
  # provenance" section.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          # provenance requires publishing through a registry that supports
          # it; the default registry-url is npmjs.org, set explicitly here
          # so this doesn't silently depend on setup-node's default.
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # OIDC trusted publishing requires npm >= 11.5; Node 20 runners ship
      # npm 10, so upgrade the npm CLI itself before publishing. Pinned to
      # the npm 11 line on purpose: @latest broke this workflow the day
      # npm 12 dropped Node 20 support (EBADENGINE, run 29930659781).
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

      - run: npm run build

      # No auth env var: npm exchanges this job's OIDC identity with
      # npmjs.com's Trusted Publisher config (Redential/redential-cli +
      # release.yml) at publish time.
      - run: npm publish --provenance --access public

  # Publishes both bare-name aliases (packages/redential-cli and
  # packages/redential) right after the main package, instead of the owner
  # doing it by hand later. This used to be a manual step and it drifted:
  # both aliases sat at 0.5.0 on npm while @redential/cli reached 0.9.0, so
  # `npx redential`/`npx redential-cli` could resolve a stale floor. Gating
  # this job on `needs: publish` keeps it from ever running ahead of (or
  # without) a successful main-package publish.
  #
  # There is no rename trick: each alias is its own checked-in directory
  # under packages/ with its own package.json name (`redential-cli` and
  # `redential`), so this job just runs `npm publish` twice, once per
  # directory — both ship the exact same one-file launcher, just
  # registered under two names for discoverability/typosquat defense.
  #
  # OIDC trusted publishing requires a npmjs.com Trusted Publisher entry
  # for EACH package name individually, pointing at this repo and this
  # workflow file. That means BOTH `redential-cli` and `redential` need
  # their own Trusted Publisher config (see docs/releasing.md) — if either
  # is missing or misconfigured, this job fails on that publish step while
  # the `publish` job above (and therefore @redential/cli's release) is
  # unaffected, since jobs in this workflow don't share failure state.
  publish-alias:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Same npm 11 requirement as the main publish job above — OIDC
      # trusted publishing needs npm >= 11.5 and Node 20 runners ship
      # npm 10.
      - run: npm install -g npm@11

      # Neither alias has a build step or tests of its own (each is a
      # single bin.js that forwards argv into @redential/cli); the
      # `publish` job's `npm test`/`tsc`/`npm run build` already gate the
      # real logic both aliases depend on via `needs: publish`.
      - run: npm publish --provenance --access public
        working-directory: packages/redential-cli

      - run: npm publish --provenance --access public
        working-directory: packages/redential

  # Standalone binaries (issue #87, docs/install-binaries.md): a Node SEA
  # executable built per-OS/arch by scripts/build-sea.mjs, so each build runs
  # on that platform's own runner instead of being cross-compiled — SEA
  # embeds the HOST Node binary, there is no cross-target story. Gated on
  # `needs: publish` for the same reason `publish-alias` is: never ship a
  # binary for a tag whose npm publish didn't succeed.
  #
  # This job only builds + smoke-tests + uploads a workflow artifact per
  # platform; attaching the assets to the GitHub Release and generating
  # SHA256SUMS happens once, in `release-binaries` below, after every
  # platform succeeds — one aggregation point instead of five racing
  # `gh release upload` calls.
  binaries:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64 (Apple Silicon)
          - os: macos-13 # x64 (Intel)
          - os: ubuntu-latest # x64
          - os: ubuntu-24.04-arm # arm64
          - os: windows-latest # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build:sea

      # Computes the exact output filename (see scripts/build-sea.mjs's
      # platformAssetName) without duplicating that OS/arch mapping in YAML.
      # `shell: bash` so this one step's syntax is identical on every
      # runner, Windows included (GitHub-hosted Windows runners ship Git
      # Bash) — everything else in this job uses each runner's own default
      # shell.
      - name: Determine built binary name
        shell: bash
        run: |
          node -e "
            const map = { darwin: 'macos', linux: 'linux', win32: 'win' };
            const archMap = { arm64: 'arm64', x64: 'x64' };
            const ext = process.platform === 'win32' ? '.exe' : '';
            console.log('BINARY_NAME=redential-' + map[process.platform] + '-' + archMap[process.arch] + ext);
          " >> "$GITHUB_ENV"

      # Same checks the local Phase-1 smoke run does (--version, a
      # non-TTY `--json` scan of a throwaway fixture, schema-valid bundle,
      # detected_skills proving embedded taxonomy/signatures, the EOF error
      # path) — see scripts/smoke-sea.mjs's own comments. Never spawns the
      # binary through `npx`/a `.cmd` shim, on any OS.
      - run: node scripts/smoke-sea.mjs build/bin/${{ env.BINARY_NAME }}
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: redential-binary-${{ matrix.os }}
          path: build/bin/${{ env.BINARY_NAME }}
          if-no-files-found: error

  # Aggregates every platform's binary (downloaded from the workflow
  # artifacts `binaries` just uploaded), generates one SHA256SUMS covering
  # all of them, attaches everything to the tag's GitHub Release, and
  # attests build provenance for the binaries the same way `npm publish
  # --provenance` already does for the npm tarball.
  release-binaries:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      # contents: write is scoped to THIS job only (the top-level
      # `permissions:` block above stays `contents: read`) — it's needed for
      # `gh release upload`, which writes assets onto an existing release of
      # this same repo; nothing else in this workflow needs write access to
      # contents.
      contents: write
      # Same id-token: write rationale as the `publish` job's own comment:
      # this is what lets `attest-build-provenance` mint a Sigstore-signed
      # attestation, this time for the binaries instead of the npm tarball.
      # attestations: write is what lets it actually record that attestation
      # against this repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into one release-assets directory
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*"

      - name: Attach binaries + SHA256SUMS to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo (nothing here needs the
          # source tree), so `gh` has no local git remote to infer the
          # target repository from and does NOT fall back to
          # `GITHUB_REPOSITORY` on its own — GH_REPO makes that explicit.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" release-assets/* --clobber
